name: Generate Metrics

on:
  schedule:
    # once a day
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest
    steps:
      - name: Achievements card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Classic PAT with `repo` + `read:user`; shared with LeeKrane/github-stats
          token: ${{ secrets.ACCESS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: LeeKrane
          template: classic
          base: ""
          config_timezone: Europe/Vienna
          config_display: large
          filename: metrics-achievements.svg
          committer_branch: metrics
          committer_message: "Update achievements metrics"
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
